const KEY="pjokTeacherV5"; let db=JSON.parse(localStorage.getItem(KEY)||"{}" );

function save(){
  db.students=STUDENTS;
  localStorage.setItem(KEY,JSON.stringify(db));
  syncStudentsToCloud();
}

async function syncStudentsToCloud(){
  try{
    await fetch(API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"saveStudents",students:STUDENTS})});
    onlineStatus="Online • tersimpan lokal + dikirim ke Google Sheets";
    updateOnlineBadge();
  }catch(e){
    onlineStatus="Offline sementara • data tetap tersimpan di perangkat";
    updateOnlineBadge();
  }
}

async function loadStudentsFromCloud(){
  try{
    const r=await fetch(API_URL+"?action=getStudents",{cache:"no-store"});
    const j=await r.json();
    if(j.status==="OK" && Array.isArray(j.students) && j.students.length){
      STUDENTS.splice(0,STUDENTS.length,...j.students.map(x=>({no:Number(x.no),nis:String(x.nis||""),nisn:String(x.nisn||""),nama:String(x.nama||""),lp:String(x.lp||""),kelas:String(x.kelas||"")})));
      db.students=STUDENTS; localStorage.setItem(KEY,JSON.stringify(db));
      onlineStatus="Online • data siswa dari Google Sheets";
      updateOnlineBadge();
      if(typeof render==='function') render("dashboard");
      return true;
    }
    onlineStatus="Online • Google Sheets siap (belum ada data siswa)";
    updateOnlineBadge();
  }catch(e){
    onlineStatus="Offline sementara • menggunakan data lokal";
    updateOnlineBadge();
  }
  return false;
}

function updateOnlineBadge(){
  let b=document.getElementById("onlineBadge");
  if(!b){

    b.style.cssText="position:fixed;right:14px;bottom:14px;z-index:9999;padding:9px 12px;border-radius:999px;background:#fff;border:1px solid #ddd;box-shadow:0 4px 18px rgba(0,0,0,.10);font-size:12px";
    document.body.appendChild(b);
  }
  b.textContent="☁️ "+onlineStatus;
}

function backupData(){
  db.students=STUDENTS;
  const payload={app:"PJOK DIGITAL SMPN 4 TALANG KELAPA",version:"5.3",createdAt:new Date().toISOString(),data:db};
  const blob=new Blob([JSON.stringify(payload)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  const d=new Date().toISOString().slice(0,10);
  a.download="BACKUP_PJOK_SMPN4TK_"+d+".json"; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  alert("Backup berhasil dibuat. Simpan file tersebut di tempat yang aman.");
}
function restoreData(input){
  const f=input&&input.files&&input.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=function(){
    try{
      const payload=JSON.parse(r.result);
      const incoming=payload&&payload.data?payload.data:payload;
      if(!incoming||typeof incoming!=="object")throw new Error("Format backup tidak valid.");
      if(!Array.isArray(incoming.students))throw new Error("Data siswa pada backup tidak ditemukan.");
      if(!confirm("Restore akan mengganti data aplikasi saat ini. Lanjutkan?")){input.value="";return;}
      db=incoming;
      STUDENTS.splice(0,STUDENTS.length,...incoming.students);
      save();
      settingsPage();
      if(typeof dash==="function")dash();
      alert("Restore berhasil. Data dari backup sudah dimuat.");
    }catch(err){
      input.value="";
      alert("Backup tidak dapat dipulihkan: "+err.message);
    }
  };
  r.readAsText(f);
}

function uploadTeacherPhoto(input){

function studentsPage(){

function promptStudent(old={}){
  const nama=prompt("Nama Siswa:",old.nama||""); if(!nama)return null;
  const kelas=prompt("Kelas (contoh VII.1):",old.kelas||"VII.1"); if(!kelas)return null;
  const nis=prompt("NIS:",old.nis||"")||"";
  const nisn=prompt("NISN:",old.nisn||"")||"";
  const lp=prompt("L/P:",old.lp||"L")||"L";
  return {...old,nama:nama.trim(),kelas:kelas.trim(),nis:nis.trim(),nisn:nisn.trim(),lp:lp.trim()};
}
function addStudent(){
  const s=promptStudent(); if(!s)return;
  s.no=STUDENTS.length?Math.max(...STUDENTS.map(x=>Number(x.no)||0))+1:1;
  STUDENTS.push(s); save(); studentsPage(); alert("Siswa berhasil ditambahkan.");
}
function editStudent(no){
  const s=STUDENTS.find(x=>Number(x.no)===Number(no)); if(!s)return;
  const z=promptStudent(s); if(!z)return;
  Object.assign(s,z); save(); studentsPage(); alert("Data siswa diperbarui.");
}
function deleteStudent(no){
  const s=STUDENTS.find(x=>Number(x.no)===Number(no)); if(!s)return;
  if(!confirm("Hapus "+s.nama+"?"))return;
  STUDENTS.splice(STUDENTS.findIndex(x=>Number(x.no)===Number(no)),1); save(); studentsPage();
}

function scoreBase(errors){return Math.max(0,100-(+errors||0)*5)}
function forehandNorm(g,lp,n){let a=g==="VII"?(lp==="L"?[[40,100],[36,95],[32,90],[28,85],[24,80],[20,75],[16,70],[12,65]]:[[35,100],[31,95],[27,90],[23,85],[19,80],[15,75],[11,70],[7,65]]):(lp==="L"?[[45,100],[41,95],[37,90],[33,85],[29,80],[25,75],[21,70],[17,65]]:[[40,100],[36,95],[32,90],[28,85],[24,80],[20,75],[16,70],[12,65]]);for(let [min,s] of a)if(n>=min)return s;return 60}
function sprintNorm(g,lp,t){let L=g==="VII"?(lp==="L"?[5.5,6,6.5,7,7.5,8,8.5,9]:[6,6.5,7,7.5,8,8.5,9,9.5]):(lp==="L"?[8,8.5,9,9.5,10,10.5,11,11.5]:[8.8,9.3,9.8,10.3,10.8,11.3,11.8,12.3]);for(let i=0;i<L.length;i++)if(t<=L[i])return 100-i*5;return 60}
function rawSpec(g,b,i){
  if(b==="1"&&i===0)return {label:"Kesalahan",type:"error",hint:"10 kesempatan • setiap kesalahan -5"};
  if(b==="1"&&i===1)return {label:"Cone terkena",type:"error",hint:"8 cone • setiap cone terkena -5"};
  if(b==="2"&&i===0)return {label:"Kesalahan",type:"error",hint:"10 kesempatan • setiap gagal -5"};
  if(b==="2"&&i===1&&g==="VII")return {label:"Kesalahan",type:"error",hint:"10 passing • bola tidak sampai/terlalu jauh = salah • -5"};
  if(b==="2"&&i===1&&g==="VIII")return null;
  if(b==="3"&&g==="VII")return {label:"Kesalahan",type:"error",hint:"10 kesempatan • setiap salah -5"};
  if(b==="3"&&g==="VIII")return {label:"Bola masuk",type:"makes",hint:"10 kesempatan • setiap bola masuk = 10 poin"};
  if(b==="4"&&i===1)return {label:"Kesalahan",type:"error",hint:"10 kesempatan • setiap servis salah -5"};
  if(b==="4"&&i===2)return {label:"Pukulan berhasil",type:"forehand",hint:"Jumlah rally forehand berhasil selama 1 menit"};
  if(b==="5"&&i===1)return {label:"Waktu terbaik (detik)",type:"sprint",hint:"Masukkan waktu percobaan 1 dan 2 • aplikasi memilih waktu tercepat"};
  if(b==="7")return {label:"Repetisi benar",type:"fitness",hint:"Jumlah repetisi yang benar selama 1 menit"};

  ];

  students.forEach(s=>{
    const g=grade(s.kelas);
    const info=CURRICULUM[g][b];
    const sub=[];
    for(let i=0;i<maxSubs;i++){
      if(i<info.subs.length){
        const x=db.scores[scoreKey(s,b,i,g)]||{};
        sub.push(eff(x)??"");
      }else{
        sub.push("");
      }
    }
    const tx=db.tasks[s.no+"|"+g+"|T|"+b];
    const tv=tx&&tx.main!=null?Math.max(+tx.main||0,+tx.rem||0):"";
    rows.push([
      s.no,
      s.nama,
      s.kelas,
      finalFor(s,b,g,info.subs.length)??"",
      tv,
      ...sub
    ]);
  });

  // Sheet kedua berisi daftar instrumen/submateri yang digunakan pada BAB tersebut.
  const detail=[
    ["DETAIL SUBMATERI BAB "+b],
    ["Kelas","BAB","Submateri","Instrumen/Penilaian"]
  ];
  const seen={};
  students.forEach(s=>{
    const g=grade(s.kelas),info=CURRICULUM[g][b];
    info.subs.forEach((m,i)=>{
      const key=g+"|"+i;
      if(!seen[key]){
        seen[key]=true;
        detail.push([g,"BAB "+b,m.name,m.assessment||""]);
      }
    });
  });

  downloadXlsx(
    `Rekap_PJOK_BAB_${b}_${safeLabel}.xlsx`,
    [
      {name:`BAB ${b}`,rows},
      {name:"Submateri",rows:detail}
    ]
  );
}
function exportAttendanceExcel(){const c=attClass,d=attDate,a=db.att[d+"|"+c]||{},students=STUDENTS.filter(s=>s.kelas===c);const rows=[["REKAP ABSENSI PJOK"],["Kelas",c],["Tanggal",d],[],["No","NIS","NISN","Nama","L/P","Kelas","Status"]];students.forEach(s=>rows.push([s.no,s.nis||"",s.nisn||"",s.nama,s.lp||"",s.kelas,a[s.no]||"H"]));downloadXlsx(`Absensi_${c}_${d}.xlsx`,[{name:"Absensi",rows}])}
function exportAttendanceHistoryExcel(){const c=attClass,students=STUDENTS.filter(s=>s.kelas===c),dates=Object.keys(db.att||{}).filter(k=>k.endsWith("|"+c)).map(k=>k.split("|")[0]).filter(Boolean).sort();if(!dates.length){alert("Belum ada data absensi tersimpan untuk kelas "+c+".");return}const rows=[["REKAP KEHADIRAN KELAS"],["Kelas",c],[],["No","NIS","NISN","Nama","L/P","Kelas",...dates],...students.map(s=>{const row=[s.no,s.nis||"",s.nisn||"",s.nama,s.lp||"",s.kelas];dates.forEach(d=>{const a=db.att[d+"|"+c]||{};row.push(a[s.no]||"H")});return row})];downloadXlsx(`Rekap_Kehadiran_${c}.xlsx`,[{name:"Rekap Kehadiran",rows}])}

render("dashboard");
</script></body></html>
